version: "3.9"

services:
  mongodb:
    image: mongo:8.0
    container_name: sport-management-mongodb
    restart: always

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: sport_management

    volumes:
      - mongodb_data:/data/db

    networks:
      - sport-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sport-management-backend

    restart: always

    ports:
      - "5000:5000"

    depends_on:
      - mongodb

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/sport_management
      JWT_SECRET: your_secret_key

    volumes:
      - ./backend:/app
      - /app/node_modules

    networks:
      - sport-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: sport-management-frontend

    restart: always

    ports:
      - "3000:3000"

    depends_on:
      - backend

    environment:
      VITE_API_URL: http://localhost:5000/api

    volumes:
      - ./frontend:/app
      - /app/node_modules

    networks:
      - sport-network

volumes:
  mongodb_data:

networks:
  sport-network: